[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-tagger"
version = "0.1.0"
description = "Deterministic prompt generator and tagger skill for Anima and dual-channel anime diffusion models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "anima-tagger contributors" }
]
keywords = ["anime", "danbooru", "tagger", "prompting", "diffusion", "onnx", "agent-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "onnxruntime>=1.17",
    "pillow>=10.0",
    "numpy>=1.24",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
setup = [
    "huggingface_hub>=0.23",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.3.0",
]

[project.scripts]
anima-tagger = "tools.wd_tagger:main"
anima-validate = "tools.anima_validate:main"
anima-setup = "tools.setup:main"

[project.urls]
Homepage = "https://github.com/your-username/anima-tagger"
Repository = "https://github.com/your-username/anima-tagger.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
